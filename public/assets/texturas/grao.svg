<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140"><!-- Mineiro Lanche · grão de filme desenhado em código (feTurbulence), sem imagem embutida. Uso: opacity .07 e mix-blend-mode overlay, só na parede e nas molduras de foto (nunca sobre texto, logo ou painel). --><filter id="g" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0" intercept="1"/></feComponentTransfer></filter><rect width="140" height="140" filter="url(#g)"/></svg>
